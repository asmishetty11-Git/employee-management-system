spring.application.name=employee-management-system
server.port=${PORT:8080}

# The H2 development database persists between restarts and is available without
# a separate database server. Select the mysql profile to use MySQL instead.
spring.datasource.url=${H2_DATABASE_URL:jdbc:h2:file:./data/employee-management;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${H2_DATABASE_USERNAME:sa}
spring.datasource.password=${H2_DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=false

spring.jackson.serialization.write-dates-as-timestamps=false
